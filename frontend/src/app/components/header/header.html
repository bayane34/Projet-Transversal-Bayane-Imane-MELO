<header class="header">

    <a routerLink="/" class="logo">
        MELO<span>.</span>
    </a>

    <button class="menu-toggle"
            (click)="menuOpen = !menuOpen"
            [attr.aria-expanded]="menuOpen"
            aria-label="Menu">
        ☰
    </button>

    <nav [class.open]="menuOpen">
        <a routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: true}">
            Accueil
        </a>

        <a routerLink="/artistes" routerLinkActive="active">
            Artistes
        </a>

        <a routerLink="/albums" routerLinkActive="active">
            Albums
        </a>

        <a routerLink="/morceaux" routerLinkActive="active">
            Morceaux
        </a>

        <div class="auth">
            <a routerLink="/connexion">Connexion</a>
            <a routerLink="/inscription" class="btn-register">
                Inscription
            </a>
        </div>
    </nav>

</header>
